[project]
name = "dingtalk-pm-bot"
version = "0.1.0"
description = "DingTalk Stream sidecar that routes 1:1 chat to mote PM mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "dingtalk-stream>=0.24.3",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[project.scripts]
dingtalk-pm-bot = "dingtalk_pm_bot.main:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
